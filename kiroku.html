<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>予定記録</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <style>
  body {
    font-family: sans-serif;
    padding: 16px;
  }

  input, button {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
  }

  button {
    cursor: pointer;
  }

  h1 {
    font-size: 24px;
  }
</style>
  <body>
    <h1>予定登録</h1>

    <input id="title" placeholder="予定名">
    <input id="date" type="date">
    <input id="time" type="time">

    <input id="time" type="time">
    
    <button id="login">Googleへログイン</button>
    <button id="add">登録</button>
    <p id="message"></p>

    <script src="https://accounts.google.com/gsi/client"></script>
    
    <script>
      const CLIENT_ID = "534929212094-2pe5teem7kg60ea0rlo856hh0usog01m.apps.googleusercontent.com";

      let tokenClient;
      let accessToken = "";
      
      window.onload = () => {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: "https://www.googleapis.com/auth/calendar.events",

          callback: (response) => {
            accessToken = response.access_token;

            console.log("ログイン成功！");
            console.log(accessToken);
          }
        });
      };
      
      document.getElementById("login").addEventListener("click", () => {
        tokenClient.requestAccessToken();
      });
      
      document.getElementById("add").addEventListener("click" , () => {

        if (!accessToken) {
          alert("先にGoogleへログインしてください");
          return;
        }
        
        const title = document.getElementById("title").value;
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;

        const start = new Date(`${date}T${time}`);

        const end = new Date(start);
        end.setHours(end.getHours() + 1);
        
        console.log(title);
        console.log(date);
        console.log(start);
        console.log(end);

        const event = {
          summary: title,
          start: {
            dateTime: start.toISOString()
          },
          end: {
            dateTime: end.toISOString()
          }
        };

        fetch(
          "https://www.googleapis.com/calendar/v3/calendars/primary/events",
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${accessToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(event)
          }
        )
        .then(response => response.json())
        .then(data => {
          console.log("予定作成成功！");
          console.log(data);

          document.getElementById("title").value = "";
          document.getElementById("date").value = "";
          document.getElementById("time").value = "";

          const msg = document.getElementById("message");
          msg.textContent = "登録完了！";
          msg.style.color = "green";

          setTimeout(() => {
            msg.textContent = "";
          }, 2000);
        })
        .catch(error => {
          console.error("エラー:", error);
        })                                           
      });
    </script>
  </body>
</html>
